plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

group = 'cn.sjtu.sjmcl'
version = '1.0.0'
base.archivesName = 'litematic-viewer-exporter-forge-1.20.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

legacyForge {
    version = '1.20.1-47.1.3'
    runs {
        client { client() }
    }
    mods {
        litematic_viewer_exporter { sourceSet(sourceSets.main) }
    }
}

dependencies {
    runtimeOnly 'de.oceanlabs.mcp:mcp_config:1.20.1-20230612.114412@zip'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
